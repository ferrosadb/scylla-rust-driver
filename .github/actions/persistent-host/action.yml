# Keep a job on a persistent self-hosted runner away from its owner's files.
#
# A GitHub-hosted runner is a VM thrown away after every job, so the actions
# this repo uses were free to treat $HOME as scratch. Ferrosa's Linux runners
# are not VMs. Both private instances run as a PERSON'S login account on a
# shared workstation, with that person's own ~/.cargo, ~/.rustup, ~/.profile
# and ~/.docker, beside a live ferrosa-memory cluster and other services.
#
# What the actions do to $HOME when nobody stops them, read from the pinned
# sources rather than assumed:
#
#   dtolnay/rust-toolchain   installs rustup when none is on PATH (the runner's
#                            PATH has none) WITHOUT --no-modify-path, so
#                            rustup-init appends to ~/.profile and ~/.bashrc;
#                            then runs `rustup default <toolchain>`, rewriting
#                            ~/.rustup/settings.toml for every shell on the box.
#   Swatinem/rust-cache      in its post step DELETES every file that was in
#                            $CARGO_HOME/bin when it started (so the cache holds
#                            only what the job installed) -- on a workstation
#                            that is rustup, cargo and anything hand-installed --
#                            and deletes $CARGO_HOME/credentials.toml.
#   docker login             writes a registry token into ~/.docker/config.json,
#                            where it outlives the job.
#   the test suites          read $HOME for config paths.
#
# So on a self-hosted runner this points all of it at runner-owned directories:
#
#   HOME             $RUNNER_TEMP/home           per job, emptied by the runner
#   DOCKER_CONFIG    $RUNNER_TEMP/docker-config  per job, so logins die with it
#   RUSTUP_HOME      $RUNNER_TOOL_CACHE/ferrosa-ci/rustup
#   CARGO_HOME       $RUNNER_TOOL_CACHE/ferrosa-ci/<repo>/cargo
#   CARGO_TARGET_DIR $GITHUB_WORKSPACE/target    see below; a symlink to
#                    $RUNNER_TOOL_CACHE/ferrosa-ci/<repo>/target
#
# CARGO_TARGET_DIR is NOT redundant with CARGO_HOME, and leaving it unset is
# what broke every Linux release build between 2026-09-15 and this commit.
#
# Cargo does not find `build.target-dir` only in $CARGO_HOME/config.toml. It
# ALSO walks every ancestor directory of the cwd looking for `.cargo/config.toml`
# and merges what it finds. The runner's workspace is
# /home/bkearns/data/actions-runner-private*/_work/<repo>/<repo>, so that walk
# reaches /home/bkearns/.cargo/config.toml -- the runner account's own config,
# which this workstation sets to
#
#   [build]
#   target-dir = "/home/bkearns/.local/share/cargo-target"
#
# (a deliberate machine-wide setting: per-worktree target dirs filled the root
# filesystem twice). Redirecting HOME and CARGO_HOME does not suppress it,
# because the ancestor walk keys off the CWD, not $HOME.
#
# The result was a job where `cargo build --release --target <triple>` printed
# `Finished`, exited 0, and created no `target/` in the workspace at all --
# every artifact went to the shared directory. The release workflow then ran
# `strip target/<triple>/release/ferrosa-memory` and died on a one-line
# `No such file`, and ci.yml uploaded an empty `target/doc`. Two release runs
# also stalled for minutes on `Blocking waiting for file lock on build
# directory`, because the two runner instances and the account's own builds
# were all serializing on that one shared target dir.
#
# Setting CARGO_TARGET_DIR here fixes both: the environment variable outranks
# every config file, so each job builds into its own workspace -- the layout
# every `target/...` path in this repo's workflows assumes, and the one a
# GitHub-hosted runner gives for free.
#
# That path is a SYMLINK into the runner instance's tool cache
# (persistent-target.sh). actions/checkout's `git clean -ffdx` used to delete
# target/ at the start of every run, and rust-cache saves nothing on a
# self-hosted runner, so every job built from nothing. git clean removes the
# link and leaves the build. It is one dir per instance per repository, for the
# same reason as below: one instance runs one job at a time, so there is no
# lock contention, which is what the machine-wide target-dir above caused.
# It is bounded by `max-target-gib`: over the cap, it is deleted with a
# ::warning:: that gives the size and the path. A job whose target/ must be a
# real directory (one a container sees through a mount of the checkout alone)
# passes `persistent-target: "false"`.
#
# The last two persist on purpose: a toolchain download per job would dwarf the
# build. RUNNER_TOOL_CACHE is per runner INSTANCE (_work/_tool), and one
# instance runs one job at a time, so nothing else writes there concurrently.
# CARGO_HOME is per repository because rust-cache prunes the registry down to
# the crates of the job that saved last.
#
# Last, on the self-hosted Linux runners whose host provides the shared sccache
# store, it turns that on (scripts/shared-sccache.sh): CARGO_HOME moves to the
# one path every Linux runner shares, $FERROSA_CI_SHARED_HOME/cargo-home,
# because sccache hashes the registry's paths and per-repository homes never
# hit; and RUSTC_WRAPPER becomes a checksum-pinned sccache. That REPLACES the
# per-repository CARGO_HOME above. Everywhere else it logs one line saying why
# it is off. Release and publishing jobs pass `shared-cache: "false"`, so a
# poisoned cache entry cannot reach a shipped binary. sccache complements the
# persistent target/: that one keeps this instance's own build, the store
# shares compiled crates between instances, hosts and repositories.
#
# It also refuses to start a job on a disk that is nearly full. A persistent
# host that fills up fails every later job that lands on it, in any repo, with a
# symptom that names something else (a linker SIGBUS, an extractor's ENOSPC, an
# image build stopping mid-layer -- t_b0dd0312). See require-free-disk.sh.
#
# Must run AFTER actions/checkout (it is a local action) and BEFORE any
# toolchain, cache or docker step. Does nothing on a GitHub-hosted runner.
name: Isolate a persistent self-hosted runner
description: >-
  On a self-hosted runner, point HOME, CARGO_HOME, RUSTUP_HOME, CARGO_TARGET_DIR
  and DOCKER_CONFIG at runner-owned directories so toolchain, cache and docker
  actions cannot modify the account the runner runs as -- and so an ancestor
  .cargo/config.toml cannot move the build output out of the workspace. No-op on
  GitHub-hosted runners. Fails if the runner's disks are nearly full.

inputs:
  target-dir:
    description: >-
      CARGO_TARGET_DIR for the job. Defaults to target/ at the workspace root;
      a job that checks out into a subdirectory passes that checkout's target/.
    required: false
    default: ""
  persistent-target:
    description: >-
      "true" makes target-dir a symlink to a per-instance directory in the
      runner's tool cache that survives git clean. "false" keeps a real
      directory in the workspace that git clean removes.
    required: false
    default: "true"
  max-target-gib:
    description: >-
      Size cap for the persistent target dir. Over it, the dir is deleted
      before the job, with a warning.
    required: false
    default: "40"
  min-free-gib:
    description: Fail unless every filesystem the job writes to has this many GiB free.
    required: false
    default: "25"
  check-docker-root:
    description: Include Docker's data filesystem in the free-space check for jobs that use Docker.
    required: false
    default: "true"
  shared-cache:
    description: >-
      "true" uses the shared sccache store when the runner's host provides it
      (self-hosted Linux; every job here isolates HOME). Release and publishing
      jobs pass "false" so nothing from a shared cache reaches a shipped
      artifact.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Before the free-disk check, so the cap is applied to the build output
    # first and a nearly full disk is left for that check to name.
    - name: Keep target/ across runs (bounded)
      if: runner.environment != 'github-hosted'
      shell: bash
      env:
        TARGET_DIR_INPUT: ${{ inputs.target-dir }}
        PERSISTENT_TARGET: ${{ inputs.persistent-target }}
        MAX_TARGET_GIB: ${{ inputs.max-target-gib }}
      run: |
        set -euo pipefail
        : "${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is unset; cannot place the persistent target dir}"
        : "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is unset}"
        repo="${GITHUB_REPOSITORY#*/}"
        link="${TARGET_DIR_INPUT:-$GITHUB_WORKSPACE/target}"
        # A job that builds a subdirectory gets its own persistent dir, named
        # after that subdirectory, so two layouts never share one.
        suffix=""
        if [ -n "$TARGET_DIR_INPUT" ]; then
          rel="${TARGET_DIR_INPUT#"$GITHUB_WORKSPACE"/}"
          suffix="-$(printf '%s' "$rel" | tr -c 'A-Za-z0-9._-' '_')"
        fi
        script="${{ github.action_path }}/../../scripts/persistent-target.sh"
        case "$PERSISTENT_TARGET" in
          true)  bash "$script" persist "$link" "$RUNNER_TOOL_CACHE/ferrosa-ci/$repo/target$suffix" "$MAX_TARGET_GIB" ;;
          false) bash "$script" local "$link" ;;
          *) echo "::error::persistent-target must be \"true\" or \"false\", got \"$PERSISTENT_TARGET\""; exit 1 ;;
        esac

    - name: Point HOME, cargo, rustup and docker at runner-owned directories
      if: runner.environment != 'github-hosted'
      shell: bash
      env:
        TARGET_DIR_INPUT: ${{ inputs.target-dir }}
      run: |
        set -euo pipefail
        : "${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is unset; cannot place the persistent toolchain homes}"
        : "${RUNNER_TEMP:?RUNNER_TEMP is unset; cannot place the per-job home}"
        : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is unset}"
        : "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is unset; cannot pin CARGO_TARGET_DIR to the workspace}"

        real_home="$HOME"
        repo="${GITHUB_REPOSITORY#*/}"
        persist="$RUNNER_TOOL_CACHE/ferrosa-ci"
        cargo_home="$persist/$repo/cargo"
        rustup_home="$persist/rustup"
        job_home="$RUNNER_TEMP/home"
        docker_config="$RUNNER_TEMP/docker-config"
        target_dir="${TARGET_DIR_INPUT:-$GITHUB_WORKSPACE/target}"

        # target_dir exists already: the step above made it (a link or a
        # directory).
        mkdir -p "$cargo_home/bin" "$rustup_home" "$job_home" "$docker_config"

        # The docker CLI finds plugins (compose, buildx) under DOCKER_CONFIG as
        # well as the system directories. A user-level install lives in
        # ~/.docker/cli-plugins, so keep it visible instead of making
        # `docker compose` vanish along with the credentials store.
        if [ -d "$real_home/.docker/cli-plugins" ]; then
          ln -sfn "$real_home/.docker/cli-plugins" "$docker_config/cli-plugins"
        fi

        {
          echo "HOME=$job_home"
          echo "CARGO_HOME=$cargo_home"
          echo "RUSTUP_HOME=$rustup_home"
          echo "CARGO_TARGET_DIR=$target_dir"
          echo "DOCKER_CONFIG=$docker_config"
        } >> "$GITHUB_ENV"
        echo "$cargo_home/bin" >> "$GITHUB_PATH"

        echo "runner:            ${RUNNER_NAME:-unknown} on $(uname -n)"
        echo "HOME               $real_home -> $job_home"
        echo "CARGO_HOME         $cargo_home"
        echo "RUSTUP_HOME        $rustup_home"
        if [ -L "$target_dir" ]; then
          echo "CARGO_TARGET_DIR   $target_dir -> $(readlink "$target_dir")"
        else
          echo "CARGO_TARGET_DIR   $target_dir"
        fi
        echo "DOCKER_CONFIG      $docker_config"

        # Name the config files that were about to move the build output, so
        # the next person to hit this sees the cause in the log instead of a
        # `strip: No such file` twenty minutes later. Purely informational --
        # CARGO_TARGET_DIR above already outranks all of them.
        dir="$GITHUB_WORKSPACE"
        while [ -n "$dir" ] && [ "$dir" != "/" ]; do
          if [ -f "$dir/.cargo/config.toml" ] || [ -f "$dir/.cargo/config" ]; then
            echo "note: an ancestor cargo config exists at $dir/.cargo/ (overridden by CARGO_TARGET_DIR)"
          fi
          dir="$(dirname "$dir")"
        done

    - name: Require free disk on the runner
      if: runner.environment != 'github-hosted'
      shell: bash
      env:
        MIN_FREE_GIB: ${{ inputs.min-free-gib }}
        CHECK_DOCKER_ROOT: ${{ inputs.check-docker-root }}
      run: |
        set -euo pipefail
        # HOME now points at RUNNER_TEMP and cargo/rustup point at the runner
        # tool cache. Check those filesystems rather than the unused account
        # home. Docker's data root is included only for jobs that use Docker.
        docker_root=""
        case "$CHECK_DOCKER_ROOT" in
          true) ;;
          false) ;;
          *) echo "::error::check-docker-root must be true or false, got '$CHECK_DOCKER_ROOT'"; exit 1 ;;
        esac
        if [ "$CHECK_DOCKER_ROOT" = true ] && command -v docker >/dev/null 2>&1; then
          docker_root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null)" \
            || { docker_root=""; echo "note: docker is installed but 'docker info' failed; its data root is not checked"; }
        fi
        bash "${{ github.action_path }}/../../scripts/require-free-disk.sh" "$MIN_FREE_GIB" \
          "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE" "$HOME" $docker_root

    # No `if:` -- on every runner it either turns the store on or says why not.
    - name: Share compiled crates through sccache
      shell: bash
      env:
        SHARED_CACHE_INPUT: ${{ inputs.shared-cache }}
        # This action has no isolate-home input: on a self-hosted runner it
        # always isolates HOME and CARGO_HOME.
        ISOLATE_HOME_INPUT: "true"
        RUNNER_KIND: ${{ runner.environment }}
        RUNNER_OS_NAME: ${{ runner.os }}
      run: bash "${{ github.action_path }}/../../scripts/shared-sccache.sh" setup
